name: Ovis Fit · TestFlight

# Xcode açmadan: GitHub'ın macOS sunucusu uygulamayı imzalar ve App Store Connect'e (TestFlight) yükler.
# Gerekli depo sırları (Settings › Secrets and variables › Actions):
#   ASC_KEY_ID      App Store Connect API anahtar kimliği (ör. 2X9R4HXF34)
#   ASC_ISSUER_ID   Issuer ID (UUID)
#   ASC_KEY_P8      İndirilen AuthKey_XXXX.p8 dosyasının TÜM içeriği (-----BEGIN PRIVATE KEY----- dahil)
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "App Store Connect'teki uygulamanın Bundle ID'si"
        default: com.ovis.fit
        required: true
      notes:
        description: "TestFlight'ta görünecek kısa not (isteğe bağlı)"
        required: false

concurrency:
  group: ovisfit-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: 3Q2KZ332U9
    defaults:
      run:
        working-directory: ovisfit/Prototip
    steps:
      - uses: actions/checkout@v4

      - name: Xcode seç
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Sırları kontrol et ve API anahtarını yaz
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::$v sırrı tanımlı değil (Settings › Secrets and variables › Actions)"; exit 1; }
          done
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"; chmod 600 "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 bir .p8 anahtarı gibi görünmüyor"; exit 1; }
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Arşivle (Release, otomatik imza)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project OvisFit.xcodeproj -scheme OvisFit -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OvisFit.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" OVIS_BUNDLE_ID="${{ inputs.bundle_id }}" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee archive-log.txt | grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive-log.txt || { grep -n -A15 "error:" archive-log.txt | head -150; exit 1; }

      - name: TestFlight'a yükle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OvisFit.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee upload-log.txt | grep -E "error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)|Uploaded" || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" upload-log.txt || { grep -n -B2 -A15 "error" upload-log.txt | head -150; exit 1; }
          echo "### ✅ TestFlight'a yüklendi: sürüm 1.0.0 (${BUILD_NUMBER})" >> "$GITHUB_STEP_SUMMARY"
          [ -n "${{ inputs.notes }}" ] && echo "Not: ${{ inputs.notes }}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Anahtarı sil
        if: always()
        run: rm -f "$ASC_KEY_PATH"
